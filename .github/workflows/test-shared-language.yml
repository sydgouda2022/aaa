name: Shared Egyptian Language Platform — Contract Tests
on:
  push:
    branches: [main]
    paths:
      - 'shared-language/**'
      - '.github/workflows/test-shared-language.yml'
  pull_request:
    paths:
      - 'shared-language/**'
      - '.github/workflows/test-shared-language.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-script-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate Coptic first-run install, corruption repair and rollback
        run: node --test shared-language/tests/coptic_install.test.mjs
      - name: Validate Coptic deterministic source-pack publishing
        run: |
          python shared-language/src/publish_coptic_release.py --coptic renpet/web/assets/dictionaries/coptic.json --popular renpet/web/assets/dictionaries/coptic-popular.json --out /tmp/coptic-offline-release
          python -c "import json; from pathlib import Path; m=json.loads(Path('/tmp/coptic-offline-release/manifest.json').read_text());p=json.loads(Path('/tmp/coptic-offline-release/lexicon.json').read_text());assert m['spelling_records']==len(p['rows']) and m['language']=='cop' and not m['complete']"
      - name: Validate recovery and integrity handling with real release bytes
        run: node --test shared-language/tests/lexicon_install.test.mjs
      - name: Check deterministic Late Egyptian release publication
        run: |
          python shared-language/src/publish_release.py --catalog shared-language/releases/dev-late-egyptian/lexicon.json --out /tmp/late-egyptian-release
          python -c "import json; from pathlib import Path; a=json.loads(Path('shared-language/releases/dev-late-egyptian/manifest.json').read_text()); b=json.loads(Path('/tmp/late-egyptian-release/manifest.json').read_text()); assert a==b"
          cmp shared-language/releases/dev-late-egyptian/lexicon.json /tmp/late-egyptian-release/lexicon.json
      - name: Validate reusable JS predictor
        run: node --test shared-language/tests/predict.test.mjs
      - name: Validate Python pack builder
        run: python -m unittest discover -s shared-language/tests -p 'test_*.py' -v
