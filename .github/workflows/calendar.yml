name: Update Egyptian calendar feeds
on:
  push:
    paths:
      - 'generate.mjs'
      - '.github/workflows/calendar.yml'
  schedule:
    - cron: '12 3 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node generate.mjs
      - name: Commit changed subscription files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Egyptian calendar feeds"
            git push
          fi
