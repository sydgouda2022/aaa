name: Export source snapshot for four-stream migration
on:
  push:
    branches:
      - export/four-stream-snapshot-20261025
    paths:
      - .github/workflows/export-four-stream-snapshot.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build verified tracked-source snapshot
        run: |
          set -euo pipefail
          mkdir -p snapshot
          git ls-files -z | tar --null -T - -cf snapshot/aaa-source.tar
          git rev-parse HEAD > snapshot/SOURCE_COMMIT
          git ls-files | sha256sum > snapshot/TRACKED_PATHS_SHA256
          sha256sum snapshot/aaa-source.tar > snapshot/TAR_SHA256
          ls -lh snapshot/*
      - uses: actions/upload-artifact@v4
        with:
          name: aaa-tracked-source-for-split
          path: snapshot/
          if-no-files-found: error
          retention-days: 3
