name: Audit four-stream migration baseline
on:
  pull_request:
    paths:
      - 'migration/**'
      - 'scripts/audit-four-streams.mjs'
      - '.github/workflows/audit-four-streams.yml'
  push:
    branches: [main]
    paths:
      - 'migration/**'
      - 'scripts/audit-four-streams.mjs'
      - '.github/workflows/audit-four-streams.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Audit source ownership, authority and dependency DAG
        run: |
          set -euo pipefail
          node --check scripts/audit-four-streams.mjs
          node scripts/audit-four-streams.mjs | tee /tmp/four-streams-audit.json
          node - <<'NODE'
          const report=require('/tmp/four-streams-audit.json');
          if(report.separate_repositories_ready||report.downstream_auto_updates_ready)
            throw Error('Premature claim of completed migration');
          if(report.validated_paths<20)throw Error('Incomplete source audit');
          NODE
