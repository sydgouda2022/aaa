name: Deploy Egyptian Calendar PWA
on:
  push:
    paths:
      - 'worker/index.mjs'
      - 'worker/public/**'
      - 'worker/wrangler.toml'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: egyptian-calendar-cloudflare-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Deploy Egyptian PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate PWA source
        run: |
          node --check worker/index.mjs
          node --check worker/public/calendar-core.mjs
          node --check worker/public/app.js
          node --check worker/public/sw.js
          node --test tests/calendar.test.mjs
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Deploy static PWA to Cloudflare Workers
        working-directory: worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if wrangler deploy; then
              echo "Cloudflare deployed successfully on attempt $attempt."
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "::warning::Cloudflare deployment API returned an error. Retrying after cooldown ($attempt/3)."
              sleep $((attempt * 12))
            fi
          done
          echo "::error::Cloudflare deployment API failed after three attempts."
          exit 1
      - name: Smoke-test public PWA
        run: |
          URL="https://ancient-egyptian-calendar.sydgouda.workers.dev"
          for i in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 15 "$URL/" | grep -q 'id="days"'; then
              curl -fsSL --max-time 15 "$URL/manifest.webmanifest" | grep -q '"standalone"'
              curl -fsSL --max-time 15 "$URL/calendar-core.mjs" | grep -q 'yearStartUtc'
              echo "PWA deployed and publicly serving HTML, manifest and calendar engine."
              exit 0
            fi
            sleep 5
          done
          echo "::error::PWA was uploaded but the public URL did not pass the smoke test"
          exit 1
