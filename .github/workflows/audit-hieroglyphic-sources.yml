name: Audit AES stage-qualified hieroglyphic spellings
on:
  push:
    branches: [main]
    paths:
      - 'shared-language/src/audit_aes.py'
      - '.github/workflows/audit-hieroglyphic-sources.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download pinned openly reusable AES edition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aes
          base=https://raw.githubusercontent.com/simondschweitzer/aes/35276d2527cca1a055e31ed5f6683e777717170f/files/aes
          for file in _aes_bbawramessiden _aes_bbawbriefe _aes_bbawarchive _aes_sawlit; do
            curl -fLsS --retry 3 --max-time 120 "$base/$file.json" -o "/tmp/aes/$file.json"
          done
          sha256sum /tmp/aes/*.json
      - name: Report corpus chronology and verified Unicode spellings
        run: python shared-language/src/audit_aes.py /tmp/aes/*.json > /tmp/aes-audit.jsonl
      - name: Show stage filter feasibility
        run: |
          sed -n '1,85p' /tmp/aes-audit.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: aes-date-and-unicode-evidence-audit
          path: /tmp/aes-audit.jsonl
          retention-days: 14
