name: Deploy Renpet 6.6.0 to Cloudflare
on:
  push:
    branches: [main]
    paths:
      - 'renpet/**'
      - 'shared-language/src/keyboard_search.mjs'
      - 'shared-language/src/lexicon_install.mjs'
      - 'shared-language/src/publish_release.py'
      - 'shared-language/src/compile_lexica.py'
      - 'shared-language/src/publish_compiled_coptic.py'
      - 'shared-language/src/coptic_install.mjs'
      - 'shared-language/src/publish_coptic_release.py'
      - 'shared-language/releases/dev-late-egyptian/**'
      - '.github/workflows/deploy-renpet-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'renpet/**'
      - '.github/workflows/deploy-renpet-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: renpet-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Build offline assets from tracked source
        run: |
          set -euo pipefail
          mkdir -p renpet/web/assets/fonts
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansegyptianhieroglyphs/NotoSansEgyptianHieroglyphs-Regular.ttf' -o renpet/web/assets/fonts/NotoSansEgyptianHieroglyphs-Regular.ttf
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansegyptianhieroglyphs/OFL.txt' -o renpet/web/assets/fonts/OFL-NotoEgyptian.txt
          test "$(wc -c <renpet/web/assets/fonts/NotoSansEgyptianHieroglyphs-Regular.ttf)" -gt 200000
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf' -o renpet/web/assets/fonts/Cairo-VF.ttf
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/OFL.txt' -o renpet/web/assets/fonts/OFL-Cairo.txt
          test "$(wc -c <renpet/web/assets/fonts/Cairo-VF.ttf)" -gt 100000
          python renpet/tools/make_numerals.py
          python renpet/tools/build_keyboard_signs.py
          mkdir -p /tmp/lexicon-sources
          curl -fLsS --retry 3 --max-time 150 'https://huggingface.co/datasets/thesaurus-linguae-aegyptiae/tla-late_egyptian-v19-premium/resolve/main/train.jsonl' -o /tmp/lexicon-sources/tla.jsonl
          curl -fLsS --retry 3 --max-time 150 'https://raw.githubusercontent.com/simondschweitzer/aed-tei/462c722e0323e05641aea2eee8cdf1e27303d939/files/dictionary.xml' -o /tmp/lexicon-sources/aed.xml
          echo 'dfded75c7d34bc1f2f12e18af6936394dc0c5cadacd1229dc28d46751d6389df  /tmp/lexicon-sources/tla.jsonl' | sha256sum -c -
          echo 'faaca47fc4e3c89899a764e56321ca2dc051e58ef6462acedaa6205ea666b730  /tmp/lexicon-sources/aed.xml' | sha256sum -c -
          curl -fLsS --retry 3 --max-time 150 'https://raw.githubusercontent.com/KELLIA/dictionary/f365e2d239bd12b6897f3a761487e40d384b2b24/xml/Comprehensive_Coptic_Lexicon-v1.2-2020.xml' -o /tmp/lexicon-sources/coptic.xml
          echo 'ace84fce11b76386a6adb9888b2cb947056954fc9fe9c04aa0676b1f595fd43d  /tmp/lexicon-sources/coptic.xml' | sha256sum -c -
          cp shared-language/src/keyboard_search.mjs renpet/web/keyboard-search.mjs
          cp shared-language/src/lexicon_install.mjs renpet/web/lexicon-install.mjs
          cp shared-language/src/coptic_install.mjs renpet/web/coptic-install.mjs
          python shared-language/src/compile_lexica.py egyptian --tla /tmp/lexicon-sources/tla.jsonl --aed /tmp/lexicon-sources/aed.xml --out renpet/web/lexicon
          python shared-language/src/publish_release.py --catalog renpet/web/lexicon/lexicon.json --out renpet/web/lexicon
          python shared-language/src/compile_lexica.py coptic --tei /tmp/lexicon-sources/coptic.xml --forms renpet/web/assets/dictionaries/coptic.json --popular renpet/web/assets/dictionaries/coptic-popular.json --out renpet/web/coptic-lexicon
          python shared-language/src/publish_compiled_coptic.py --out renpet/web/coptic-lexicon
          # Historical source word tables are build inputs and must not ship in the PWA.
          rm renpet/web/assets/dictionaries/coptic.json renpet/web/assets/dictionaries/coptic-popular.json
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          for name,minimum in [('lexicon',6000),('coptic-lexicon',20000)]:
              root=Path('renpet/web')/name
              release=json.loads((root/'manifest.json').read_text())
              assert release['spelling_records']>=minimum and release['complete'] is False
              conn=sqlite3.connect(root/'lexicon.sqlite3')
              assert conn.execute('pragma integrity_check').fetchone()[0]=='ok'
              conn.close()
          PY
          python renpet/tools/build_csp.py
          python renpet/tools/build_service_worker.py
      - name: Validate single renderer and data
        run: |
          set -euo pipefail
          node --check renpet/web/app.js
          node --check renpet/web/responsive-layout.js
          node --check renpet/web/lexicon-install.mjs
          node --check renpet/web/coptic-install.mjs
          node --check renpet/web/keyboard.js
          node --check renpet/web/time-editor.js
          node --check renpet/web/keyboard-core.js
          node --check renpet/web/keyboard-search.mjs
          node --check renpet/web/clock.js
          node --check renpet/web/calendar.js
          node --check renpet/web/festival-catalog.js
          node renpet/tests/festival-catalog.test.mjs
          test -s renpet/web/festival-sources.json
          node --check renpet/web/locales.js
          node --check renpet/web/scheduler.js
          node --check renpet/web/backup.js
          node --check renpet/web/backup-core.mjs
          node --check renpet/web/ics-core.mjs
          node --check renpet/web/sw.js
          python renpet/tests/test_service_worker_source.py
          node --test renpet/tests/responsive-layout.test.mjs
          node renpet/tests/ui.test.mjs
          node renpet/tests/keyboard.test.mjs
          node --test shared-language/tests/keyboard_search.test.mjs
          node --test shared-language/tests/lexicon_install.test.mjs shared-language/tests/coptic_install.test.mjs
          node renpet/tests/time-editor.test.mjs
          node renpet/tests/clock.test.mjs
          test -s renpet/web/assets/fonts/NotoSansEgyptianHieroglyphs-Regular.ttf
          test -s renpet/web/assets/dictionaries/signs.json
          ! test -e renpet/web/assets/dictionaries/coptic.json
          test -s renpet/web/lexicon/lexicon.sqlite3
          test -s renpet/web/coptic-lexicon/lexicon.sqlite3
          test -s renpet/web/lexicon/lexicon.json
          test -s renpet/web/lexicon/manifest.json
          test -s renpet/web/coptic-lexicon/lexicon.json
          test -s renpet/web/coptic-lexicon/manifest.json
          ! test -e renpet/web/assets/dictionaries/coptic-popular.json
          node renpet/tests/scheduler.test.mjs
          node renpet/tests/backup.test.mjs
          node renpet/tests/ics.test.mjs
          test "$(find renpet/web/assets/numerals -name '*.svg' | wc -l)" -eq 362
          test "$(grep -o 'type="module"' renpet/web/index.html | wc -l)" -eq 1
          ! grep -q 'views.js\|style.css\|scheduler.css' renpet/web/index.html
          ! grep -q 'MutationObserver\|year-grid\|year-tile' renpet/web/app.js
          grep -q 'Single owner of #app' renpet/web/app.js
          grep -q 'openBackup' renpet/web/backup.js
          grep -q 'ui.css?v=6.6.0' renpet/web/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('renpet/web/data.json').read_text())
          assert d['version']=='6.6.0'
          assert d['min_date']=='1900-01-01' and d['max_date']=='2200-12-31'
          assert len(d['years'])>300 and len(d['festivals'])>0
          print('Calendar data and version validated')
          PY
      - name: Install Wrangler
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm install --global wrangler@4
      - name: Deploy Renpet Worker
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: renpet
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if wrangler deploy --config wrangler.worker.toml; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Smoke test production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          BASE="https://renpet.sydgouda.workers.dev"
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --max-time 20 "$BASE/?v=6.6.0" -o /tmp/renpet-index \
              && curl -fsSL --max-time 20 "$BASE/data.json" -o /tmp/renpet-data \
              && curl -fsSL --max-time 20 "$BASE/app.js?v=6.6.0" -o /tmp/renpet-app \
              && curl -fsSL --max-time 20 "$BASE/ui.css?v=6.6.0" -o /tmp/renpet-css \
              && curl -fsSL --max-time 20 "$BASE/festival-sources.json" -o /tmp/renpet-festival-sources \
              && curl -fsSL --max-time 20 "$BASE/festival-catalog.js?v=6.6.0" -o /tmp/renpet-festival-code \
              && curl -fsSL --max-time 20 "$BASE/scheduler.js" -o /tmp/renpet-scheduler \
              && curl -fsSL --max-time 20 "$BASE/lexicon/manifest.json" -o /tmp/renpet-egy-lexicon \
              && curl -fsSL --max-time 20 "$BASE/coptic-lexicon/manifest.json" -o /tmp/renpet-cop-lexicon \
              && grep -q '"version":"6.6.0"' /tmp/renpet-data \
              && grep -q 'ui.css?v=6.6.0' /tmp/renpet-index \
              && grep -q 'Single owner of #app' /tmp/renpet-app \
              && grep -q 'month-section' /tmp/renpet-css \
              && grep -q 'itemsForDay' /tmp/renpet-scheduler \
              && grep -q 'amun-theban' /tmp/renpet-festival-sources \
              && grep -q 'festivalHitsForDay' /tmp/renpet-festival-code \
              && python -c "import json; assert json.load(open('/tmp/renpet-egy-lexicon'))['spelling_records']>=6000; assert json.load(open('/tmp/renpet-cop-lexicon'))['spelling_records']>=20000"; then
              echo "Renpet 6.6.0 single-renderer build is live"
              exit 0
            fi
            sleep 6
          done
          exit 1
