name: Deploy Renpet 0.9.0 to Cloudflare
on:
  push:
    paths:
      - 'renpet/**'
      - '.github/workflows/deploy-renpet-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: renpet-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Build offline assets from tracked source
        run: |
          set -euo pipefail
          python renpet/tools/make_numerals.py
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('renpet/web')
          files=['./'+p.relative_to(root).as_posix() for p in sorted(root.rglob('*')) if p.is_file() and p.name not in {'sw.js','_headers'}]
          stamp=hashlib.sha256(b''.join((p.encode()+hashlib.sha256((root/p.removeprefix('./')).read_bytes()).digest()) for p in files)).hexdigest()[:12]
          sw="""const CACHE='renpet-0.9.0-__STAMP__';
          const ASSETS=__ASSETS__;
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x.startsWith('renpet-')&&x!==CACHE).map(x=>caches.delete(x)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{
            if(e.request.method!=='GET')return;
            const u=new URL(e.request.url);
            if(u.origin!==self.location.origin)return;
            if(e.request.mode==='navigate'){
              e.respondWith(fetch(e.request).then(r=>{if(r.ok)caches.open(CACHE).then(c=>c.put('./index.html',r.clone()));return r;}).catch(()=>caches.match('./index.html')));
            }else{
              e.respondWith(caches.match(e.request).then(c=>c||fetch(e.request).then(r=>{if(r.ok)caches.open(CACHE).then(x=>x.put(e.request,r.clone()));return r;})));
            }
          });
          """.replace('__STAMP__',stamp).replace('__ASSETS__',json.dumps(files,separators=(',',':')))
          (root/'sw.js').write_text(sw,encoding='utf-8')
          print('Built Renpet 0.9.0 from tracked sources; offline assets:',len(files))
          PY
      - name: Validate single renderer and data
        run: |
          set -euo pipefail
          node --check renpet/web/app.js
          node --check renpet/web/calendar.js
          node --check renpet/web/locales.js
          node --check renpet/web/scheduler.js
          node --check renpet/web/backup.js
          node --check renpet/web/backup-core.mjs
          node --check renpet/web/ics-core.mjs
          node --check renpet/web/sw.js
          node renpet/tests/ui.test.mjs
          node renpet/tests/scheduler.test.mjs
          node renpet/tests/backup.test.mjs
          node renpet/tests/ics.test.mjs
          test "$(find renpet/web/assets/numerals -name '*.svg' | wc -l)" -eq 333
          test "$(grep -o 'type="module"' renpet/web/index.html | wc -l)" -eq 1
          ! grep -q 'views.js\|style.css\|scheduler.css' renpet/web/index.html
          ! grep -q 'MutationObserver\|year-grid\|year-tile' renpet/web/app.js
          grep -q 'Single owner of #app' renpet/web/app.js
          grep -q 'openBackup' renpet/web/backup.js
          grep -q 'ui.css?v=0.9.0' renpet/web/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('renpet/web/data.json').read_text())
          assert d['version']=='0.9.0'
          assert d['min_date']=='1900-01-01' and d['max_date']=='2200-12-31'
          assert len(d['years'])>300 and len(d['festivals'])>0
          print('Calendar data and version validated')
          PY
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Deploy Renpet Worker
        working-directory: renpet
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if wrangler deploy --config wrangler.worker.toml; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Smoke test production
        run: |
          set -euo pipefail
          BASE="https://renpet.sydgouda.workers.dev"
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --max-time 20 "$BASE/?v=0.9.0" -o /tmp/renpet-index \
              && curl -fsSL --max-time 20 "$BASE/data.json" -o /tmp/renpet-data \
              && curl -fsSL --max-time 20 "$BASE/app.js?v=0.9.0" -o /tmp/renpet-app \
              && curl -fsSL --max-time 20 "$BASE/ui.css?v=0.9.0" -o /tmp/renpet-css \
              && curl -fsSL --max-time 20 "$BASE/scheduler.js" -o /tmp/renpet-scheduler \
              && grep -q '"version":"0.9.0"' /tmp/renpet-data \
              && grep -q 'ui.css?v=0.9.0' /tmp/renpet-index \
              && grep -q 'Single owner of #app' /tmp/renpet-app \
              && grep -q 'month-section' /tmp/renpet-css \
              && grep -q 'itemsForDay' /tmp/renpet-scheduler; then
              echo "Renpet 0.9.0 single-renderer build is live"
              exit 0
            fi
            sleep 6
          done
          exit 1
