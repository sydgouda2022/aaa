name: Test single subscription
on:
  push:
    paths:
      - 'worker/**'
      - 'scripts/**'
      - 'calendar/**'
      - '.github/workflows/test-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m py_compile scripts/prepare_cloudflare.py
      - run: node --test worker/test.mjs
