name: Renpet 3 free iPhone UX verification
on:
  pull_request:
    branches: [main]
    paths: ['renpet/**','.github/workflows/renpet-mobile-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Free local-browser tooling and assets
        run: |
          npm install --no-save --prefix /tmp/renpet-pw playwright@1.56.1
          mkdir -p renpet/web/assets/fonts
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansegyptianhieroglyphs/NotoSansEgyptianHieroglyphs-Regular.ttf' -o renpet/web/assets/fonts/NotoSansEgyptianHieroglyphs-Regular.ttf
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf' -o renpet/web/assets/fonts/Cairo-VF.ttf
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/OFL.txt' -o renpet/web/assets/fonts/OFL-Cairo.txt
          test "$(wc -c <renpet/web/assets/fonts/Cairo-VF.ttf)" -gt 100000
          python renpet/tools/make_numerals.py
          python renpet/tools/build_keyboard_signs.py
          cp shared-language/src/lexicon_install.mjs renpet/web/lexicon-install.mjs
          cp shared-language/src/coptic_install.mjs renpet/web/coptic-install.mjs
          python shared-language/src/publish_coptic_release.py --coptic renpet/web/assets/dictionaries/coptic.json --popular renpet/web/assets/dictionaries/coptic-popular.json --out renpet/web/coptic-lexicon
          python shared-language/src/publish_release.py --catalog shared-language/releases/dev-late-egyptian/lexicon.json --out renpet/web/lexicon
          python renpet/tools/build_csp.py
          python renpet/tools/build_service_worker.py
          python renpet/tests/test_service_worker_source.py
          if ! command -v google-chrome >/dev/null; then /tmp/renpet-pw/node_modules/.bin/playwright install chromium; fi
      - name: Start Renpet for interaction tests
        run: |
          nohup python -m http.server 8765 --bind 127.0.0.1 --directory renpet/web >/tmp/renpet-python.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/ >/dev/null
      - name: Exercise live HTML, CSS and events at two iPhone sizes
        env:
          NODE_PATH: /tmp/renpet-pw/node_modules
        run: node renpet/tests/mobile-ux.cjs
      - name: Install WebKit and system packages for Safari-compatible save test
        run: /tmp/renpet-pw/node_modules/.bin/playwright install --with-deps webkit
      - name: Verify iOS WebKit appointment save for all scripts
        env:
          NODE_PATH: /tmp/renpet-pw/node_modules
        run: node renpet/tests/safari-save.cjs
      - name: Test direct-delete and drag-resize using iPhone WebKit
        env:
          NODE_PATH: /tmp/renpet-pw/node_modules
        run: node renpet/tests/safari-direct-actions.cjs
      - name: Offline startup and recovery on iOS WebKit and Chromium
        env:
          NODE_PATH: /tmp/renpet-pw/node_modules
        run: node renpet/tests/offline-startup.cjs
      - name: Save screenshots and issue report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renpet-3-mobile-qa
          path: renpet-mobile-evidence/
          retention-days: 14
