name: Build and deploy MdwNfr iPhone PWA
on:
  push:
    branches: [main]
    paths:
      - 'mdwnfr/.source/**'
      - 'shared-language/src/lexicon_install.mjs'
      - 'shared-language/src/publish_release.py'
      - 'shared-language/src/compile_lexica.py'
      - 'shared-language/adapters/mdwnfr-worker.js'
      - 'shared-language/adapters/mdwnfr-offline-publication.py'
      - 'shared-language/releases/dev-late-egyptian/**'
      - 'mdwnfr/wrangler.toml'
      - 'mdwnfr/worker.mjs'
      - '.github/workflows/deploy-mdwnfr.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mdwnfr-production
  cancel-in-progress: false
jobs:
  build-deploy:
    name: Build Python 3.12 PWA and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Recover pinned MdwNfr 0.1.42 source archive
        shell: bash
        run: |
          set -euo pipefail
          cat mdwnfr/.source/part*.b64.txt | base64 --decode > /tmp/mdwnfr-source.tar.gz
          echo '893615ce164747ca9baf7a673f179d88ad3714281009b13b5380c11ecf21d322  /tmp/mdwnfr-source.tar.gz' | sha256sum -c -
          tar -tzf /tmp/mdwnfr-source.tar.gz > /tmp/mdwnfr-source.lst
          grep -q '^core/mdwnfr/api.py$' /tmp/mdwnfr-source.lst
          tar -xzf /tmp/mdwnfr-source.tar.gz -C mdwnfr
          test -s mdwnfr/web/app.js
          test -s mdwnfr/core/mdwnfr/data/lexicon.json
      - name: Attach independent verified lexicon installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lexicon-sources
          curl -fLsS --retry 3 --max-time 150 'https://huggingface.co/datasets/thesaurus-linguae-aegyptiae/tla-late_egyptian-v19-premium/resolve/main/train.jsonl' -o /tmp/lexicon-sources/tla.jsonl
          curl -fLsS --retry 3 --max-time 150 'https://raw.githubusercontent.com/simondschweitzer/aed-tei/462c722e0323e05641aea2eee8cdf1e27303d939/files/dictionary.xml' -o /tmp/lexicon-sources/aed.xml
          echo 'dfded75c7d34bc1f2f12e18af6936394dc0c5cadacd1229dc28d46751d6389df  /tmp/lexicon-sources/tla.jsonl' | sha256sum -c -
          echo 'faaca47fc4e3c89899a764e56321ca2dc051e58ef6462acedaa6205ea666b730  /tmp/lexicon-sources/aed.xml' | sha256sum -c -
          cp shared-language/src/lexicon_install.mjs mdwnfr/web/lexicon-install.mjs
          cp shared-language/adapters/mdwnfr-worker.js mdwnfr/web/worker.js
          cp shared-language/adapters/mdwnfr-offline-publication.py mdwnfr/tools/offline_publication.py
          python shared-language/src/compile_lexica.py egyptian --tla /tmp/lexicon-sources/tla.jsonl --aed /tmp/lexicon-sources/aed.xml --out mdwnfr/web/lexicon
          python shared-language/src/publish_release.py --catalog mdwnfr/web/lexicon/lexicon.json --out mdwnfr/web/lexicon
          cp mdwnfr/web/lexicon/lexicon.json mdwnfr/core/mdwnfr/data/lexicon.json
          python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          dest=Path('mdwnfr/web/lexicon')
          data=json.loads((dest/'manifest.json').read_text())
          assert data['spelling_records']>=6000 and data['complete'] is False
          db=sqlite3.connect(dest/'lexicon.sqlite3')
          assert db.execute('pragma integrity_check').fetchone()[0]=='ok'
          db.close()
          PY
          node --test shared-language/tests/lexicon_install.test.mjs
      - name: Install redistributable Egyptian font
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'fonttools[woff]' brotli
          mkdir -p mdwnfr/web/assets/fonts
          curl -fLsS --retry 3 --max-time 120 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansegyptianhieroglyphs/NotoSansEgyptianHieroglyphs-Regular.ttf' -o /tmp/mdwnfr-hieroglyphs.ttf
          curl -fLsS --retry 3 --max-time 120 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansegyptianhieroglyphs/OFL.txt' -o mdwnfr/web/assets/fonts/OFL-NotoEgyptian.txt
          python - <<'PY'
          from fontTools.ttLib import TTFont
          from pathlib import Path
          target=Path('mdwnfr/web/assets/fonts/hieroglyphs.woff2')
          source='/tmp/mdwnfr-hieroglyphs.ttf'
          f=TTFont(source)
          required={0x13000,0x13080,0x13100,0x13200,0x13300,0x1342F}
          cmap=set().union(*(t.cmap.keys() for t in f['cmap'].tables))
          if not required<=cmap:raise SystemExit('Missing core hieroglyph glyphs')
          f.flavor='woff2'
          f.save(target)
          assert target.stat().st_size>100000 and target.read_bytes()[:4]==b'wOF2'
          print('Licensed Noto Egyptian hieroglyph font verified and packaged')
          PY
      - name: Download and validate self-hosted Python 3.12 / Pyodide runtime
        working-directory: mdwnfr
        shell: bash
        run: |
          set -euo pipefail
          python tools/vendor_runtime.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from runtime_assets import inspect
          r=inspect()
          assert r['offline_ready'],r
          print('Offline browser runtime ready:',r)
          PY
      - name: Build verified PWA and run source checks
        working-directory: mdwnfr
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_static.py
          node --check dist/app.js
          node --check dist/worker.js
          node --check dist/lexicon-install.mjs
          test -s dist/lexicon/manifest.json
          test -s dist/lexicon/lexicon.json
          test -s dist/lexicon/lexicon.sqlite3
          node --check dist/storage.js
          node --check dist/sw.js
          node tools/test_recovery_storage.mjs
          python -m compileall -q core/mdwnfr
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('dist')
          status=json.loads((root/'runtime-status.json').read_text())
          publication=json.loads((root/'offline-assets.json').read_text())
          assert status['offline_ready'] and publication['complete']
          assert all((root/x['path'].lstrip('/')).is_file() for x in publication['assets'])
          assert len(publication['assets'])>=100
          print('Verified complete local PWA asset manifest:',len(publication['assets']))
          PY
      - name: Validate Cloudflare publishing access
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Cloudflare account secret missing'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Cloudflare token secret missing'; exit 1; }
      - name: Publish independent MdwNfr Worker
        working-directory: mdwnfr
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --global wrangler@4
          wrangler deploy --config wrangler.toml
      - name: Public PWA smoke test
        shell: bash
        run: |
          set -euo pipefail
          base='https://mdwnfr.sydgouda.workers.dev'
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 25 "$base/" -o /tmp/mdwnfr-public-index \
              && curl -fsS --max-time 25 "$base/manifest.webmanifest" -o /tmp/mdwnfr-public-manifest \
              && curl -fsS --max-time 25 "$base/runtime-status.json" -o /tmp/mdwnfr-public-status \
              && curl -fsS --max-time 25 "$base/lexicon/manifest.json" -o /tmp/mdwnfr-public-lexicon \
              && grep -q 'MdwNfr' /tmp/mdwnfr-public-index \
              && grep -q 'standalone' /tmp/mdwnfr-public-manifest \
              && python -c "import json; assert json.load(open('/tmp/mdwnfr-public-status'))['offline_ready']; assert json.load(open('/tmp/mdwnfr-public-lexicon'))['spelling_records']>=6000"; then
              echo 'Public PWA responding with complete runtime inventory'
              exit 0
            fi
            sleep 8
          done
          echo '::error::Public PWA smoke failed'
          exit 1
