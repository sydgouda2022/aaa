name: Build and deploy MdwNfr
# MdwNfr production ownership migrated to sydgouda2022/mdwnfr.
# Manual legacy recovery only; old aaa commits must never overwrite live.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mdwnfr-production
  cancel-in-progress: false
jobs:
  build-deploy:
    name: Verify direct Python source and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate one application and one 41K lexicon
        shell: bash
        run: |
          set -euo pipefail
          test -s mdwnfr/core/mdwnfr/api.py
          test -s mdwnfr/web/app.js
          test -s mdwnfr/data/lexicon.sqlite3
          test ! -e mdwnfr/.source
          test ! -e mdwnfr/overrides
          test ! -e mdwnfr/dictionary
          test ! -e mdwnfr/main.py
          python - <<'PY'
          import hashlib,json,sqlite3
          from pathlib import Path
          base=Path('mdwnfr')
          web=(base/'web/lexicon/lexicon.json').read_bytes()
          core=(base/'core/mdwnfr/data/lexicon.json').read_bytes()
          manifest=json.loads((base/'web/lexicon/manifest.json').read_text())
          assert web==core, 'Competing runtime catalogues'
          assert hashlib.sha256(web).hexdigest()==manifest['sha256']
          assert manifest['spelling_records']==41330
          with sqlite3.connect(base/'data/lexicon.sqlite3') as con:
              assert con.execute('pragma integrity_check').fetchone()[0]=='ok'
              assert len(con.execute("select name from sqlite_master where type='table'").fetchall())>2
          print('MdwNfr canonical Python+browser lexicon and SQLite verified')
          PY
          python -m compileall -q mdwnfr/core/mdwnfr
          node --check mdwnfr/web/app.js
          node --check mdwnfr/web/worker.js
          node --check mdwnfr/web/storage.js
          node --check mdwnfr/web/sw.js
          node --test shared-language/tests/lexicon_install.test.mjs
      - name: Install licensed Egyptian hieroglyphic font
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'fonttools[woff]' brotli Pillow
          mkdir -p mdwnfr/web/assets/fonts
          curl -fLsS --retry 3 --max-time 120 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansegyptianhieroglyphs/NotoSansEgyptianHieroglyphs-Regular.ttf' -o /tmp/mdwnfr-hieroglyphs.ttf
          curl -fLsS --retry 3 --max-time 120 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansegyptianhieroglyphs/OFL.txt' -o mdwnfr/web/assets/fonts/OFL-NotoEgyptian.txt
          python - <<'PY'
          from fontTools.ttLib import TTFont
          from pathlib import Path
          f=TTFont('/tmp/mdwnfr-hieroglyphs.ttf')
          chars=set().union(*(t.cmap.keys() for t in f['cmap'].tables))
          assert {0x13000,0x13080,0x13100,0x13200,0x13300,0x1342f}<=chars
          f.flavor='woff2'
          out=Path('mdwnfr/web/assets/fonts/hieroglyphs.woff2')
          f.save(out)
          assert out.stat().st_size>100000 and out.read_bytes()[:4]==b'wOF2'
          PY
      - name: Generate font-verified glyph silhouettes and test Python engine
        run: |
          set -euo pipefail
          python mdwnfr/tools/generate_glyph_ink.py /tmp/mdwnfr-hieroglyphs.ttf mdwnfr/core/mdwnfr/data/glyph_geometry.json
          python mdwnfr/qa/test_keyboard.py -v
          python mdwnfr/qa/test_quadrat_flow.py -v
          python mdwnfr/qa/test_silhouette_spacing.py -v
      - name: Vendor and verify self-hosted Pyodide 0.27.8
        working-directory: mdwnfr
        run: |
          set -euo pipefail
          python tools/vendor_runtime.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from runtime_assets import inspect
          assert inspect()['offline_ready']
          PY
      - name: Build and test offline PWA
        working-directory: mdwnfr
        run: |
          set -euo pipefail
          python tools/build_static.py
          node --check dist/app.js
          node --check dist/quadrat_preview.mjs
          node --check dist/hieroglyph_facing.mjs
          node --test qa/test_hieroglyph_facing.mjs
          node qa/test_quadrat_preview.mjs
          node --check dist/worker.js
          node --check dist/storage.js
          node --check dist/sw.js
          node --check dist/lexicon-install.mjs
          node qa/test_service_worker_cache.mjs
          node qa/test_pages_overview.mjs
          node tools/test_recovery_storage.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('dist')
          status=json.loads((root/'runtime-status.json').read_text())
          assets=json.loads((root/'offline-assets.json').read_text())
          assert status['offline_ready'] and assets['complete']
          assert len(assets['assets'])>=100
          assert {'/boot.mjs','/editor_controls.mjs','/hieroglyph_facing.mjs'} <= {a['path'] for a in assets['assets']}
          assert all((root/x['path'].lstrip('/')).is_file() for x in assets['assets'])
          html=(root/'index.html').read_text()
          assert '/icons/app-192.png' in html and 'app_icon.svg' not in html
          assert not (root/'lexicon/lexicon.sqlite3').exists()
          print('Offline bundle complete:',len(assets['assets']),'verified assets')
          PY
      - name: Browser acceptance — mobile word editor and persistence
        working-directory: mdwnfr
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
          python -m http.server 8123 --bind 127.0.0.1 --directory dist >/tmp/mdwnfr-browser-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS 'http://127.0.0.1:8123/runtime-status.json' >/dev/null; then break; fi
            sleep 1
          done
          node qa/test_browser_keyboard.mjs
          node qa/test_font_bounds_browser.mjs
          node qa/test_touch_editing.mjs
          node qa/test_release_update.mjs
      - name: Deploy Cloudflare Worker
        working-directory: mdwnfr
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm install --global wrangler@4
          for attempt in 1 2 3; do
            if wrangler deploy --config wrangler.toml; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Verify public Cloudflare app
        run: |
          set -euo pipefail
          base='https://mdwnfr.sydgouda.workers.dev'
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 25 "$base/" -o /tmp/mdwnfr-index \
              && curl -fsS --max-time 25 "$base/manifest.webmanifest" -o /tmp/mdwnfr-manifest \
              && curl -fsS --max-time 25 "$base/lexicon/manifest.json" -o /tmp/mdwnfr-lexicon \
              && curl -fsS --max-time 25 "$base/icons/app-192.png" -o /tmp/mdwnfr-icon \
              && python -c "import json; p=json.load(open('/tmp/mdwnfr-manifest')); d=json.load(open('/tmp/mdwnfr-lexicon')); assert p['icons'][0]['src']=='/icons/app-192.png' and d['spelling_records']==41330"; then
                echo 'Canonical MdwNfr online with approved icon and 41,330 spellings'
                exit 0
            fi
            sleep 8
          done
          exit 1
